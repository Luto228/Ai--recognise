<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Recognizer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: rgba(255, 255, 255, 0.8);
            --text: #1f2937;
            --glass: rgba(255, 255, 255, 0.1);
            --border: rgba(255, 255, 255, 0.2);
        }

        body {
            width: 320px;
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        .container {
            width: 100%;
            background: var(--bg);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
            border: 1px solid var(--border);
            text-align: center;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            background: linear-gradient(to right, #6366f1, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 0.9rem;
            color: #6b7280;
            margin-bottom: 20px;
        }

        .upload-area {
            border: 2px dashed #d1d5db;
            border-radius: 12px;
            padding: 30px 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .upload-area:hover {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.05);
        }

        .upload-area.dragover {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.1);
            transform: scale(1.02);
        }

        .icon {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            display: none;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .verdict-ai {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .verdict-real {
            background: rgba(34, 197, 94, 0.1);
            color: #22c55e;
            border: 1px solid rgba(34, 197, 94, 0.2);
        }

        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            display: none;
            margin: 10px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes modalSlideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        input[type="file"] {
            display: none;
        }

        #auth-caps-warning {
            margin-top: 5px;
            color: #9ca3af;
            font-size: 0.7rem;
            transition: all 0.3s ease;
            opacity: 0;
            transform: translateY(5px);
            display: flex;
            flex-direction: column;
            gap: 2px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="login-overlay" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; text-align: center; padding: 25px 20px 20px 20px; box-sizing: border-box; border-radius: 16px; overflow-y: auto;">
        <div id="auth-back-btn" style="position: absolute; top: 20px; left: 20px; cursor: pointer; color: #9ca3af; display: none; transition: all 0.2s; width: 24px; height: 24px;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        </div>
        <h1 id="txt-welcome" style="margin-bottom: 2px; margin-top: 0; transition: transform 0.3s ease;">Welcome</h1>
        <p id="txt-login-reg" style="margin-bottom: 15px; transition: transform 0.3s ease;">Login or Register</p>
        
        <div id="auth-inputs-container" style="display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 240px; transition: transform 0.3s ease;">
            <input type="text" id="auth-nickname" placeholder="Nickname" style="padding: 10px; border-radius: 8px; border: 1px solid #d1d5db; outline: none; transition: border-color 0.2s;">
            <div style="position: relative; width: 100%;">
                <input type="password" id="auth-password" placeholder="Password" style="padding: 10px; border-radius: 8px; border: 1px solid #d1d5db; width: 100%; box-sizing: border-box; outline: none; transition: border-color 0.2s;">
                <button id="toggle-password" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 1rem; padding: 0;">👁️</button>
            </div>
            <div id="re-password-container" style="display: none; width: 100%; animation: fadeInDown 0.3s ease;">
                <input type="password" id="auth-re-password" placeholder="Re-password" style="padding: 10px; border-radius: 8px; border: 1px solid #d1d5db; width: 100%; box-sizing: border-box; outline: none; transition: border-color 0.2s;">
            </div>
            
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button id="login-btn" style="flex: 1; background: var(--primary); color: white; border: none; padding: 10px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.2s;">Login</button>
                <button id="register-btn" style="flex: 1; background: white; color: var(--primary); border: 1px solid var(--primary); padding: 10px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.2s;">Register</button>
            </div>
            <div id="auth-caps-warning">
                <div id="caps-lang">Language: --</div>
                <div id="caps-status">у вас включен capslock on</div>
            </div>
            <div id="auth-error-msg" style="color: #ef4444; font-size: 0.75rem; margin-top: 5px; min-height: 1.2em; transition: opacity 0.3s; opacity: 0;"></div>
        </div>

        <div id="txt-enter-creds" style="margin-top: 5px; font-size: 0.7rem; color: #9ca3af; transition: opacity 0.3s ease;">
            Enter your credentials to continue.
        </div>
    </div>

    <div class="container">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 20px; padding: 20px 0;">
            <div style="text-align: center;">
                <h1 style="margin: 0; font-size: 1.5rem; background: linear-gradient(to right, #6366f1, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">AI Recognizer</h1>
                <div style="font-size: 0.9rem; color: #6b7280; margin-top: 5px;">
                    <span id="txt-hello">Hello</span>, <span id="user-name" style="font-weight: 600;"></span>!
                </div>
            </div>

            <div style="display: flex; flex-direction: column; gap: 12px; width: 100%;">
                <button id="lang-btn" style="width: 100%; background: white; color: var(--primary); border: 2px solid var(--primary); padding: 15px; border-radius: 12px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: all 0.2s;">
                    Change Language
                </button>
                <button id="logout-btn" style="width: 100%; background: #fee2e2; color: #ef4444; border: none; padding: 12px; border-radius: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s;">
                    Logout
                </button>
            </div>
        </div>
    </div>

    <!-- Language Modal -->
    <div id="lang-modal" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); z-index: 200; display: none; align-items: center; justify-content: center; border-radius: 16px;">
        <div style="background: white; width: 240px; padding: 25px; border-radius: 20px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.1); animation: modalSlideUp 0.3s ease;">
            <h2 id="txt-lang-title" style="margin-top: 0; margin-bottom: 20px; font-size: 1.2rem;">Language:</h2>
            <div style="display: flex; flex-direction: column; gap: 10px;">
                <button class="lang-opt" data-lang="en" style="padding: 12px; border-radius: 10px; border: 1px solid #e5e7eb; background: #f9fafb; cursor: pointer; font-weight: 600;">English 🇺🇸</button>
                <button class="lang-opt" data-lang="ru" style="padding: 12px; border-radius: 10px; border: 1px solid #e5e7eb; background: #f9fafb; cursor: pointer; font-weight: 600;">Русский 🇷🇺</button>
            </div>
            <button id="close-lang-btn" style="margin-top: 20px; background: none; border: none; color: #9ca3af; cursor: pointer; font-size: 0.9rem;">Close</button>
        </div>
    </div>

    <script src="shared.js"></script>
    <script src="popup.js"></script>
</body>
</html>
